<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Linear triatomic mass-spring model</title>
  <desc id="desc">Three masses arranged left to right, with outer masses m and central mass M, connected by two springs of constant k. Their displacements are x, y, and z.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f6d7a"/>
    </marker>
  </defs>
  <rect width="900" height="250" fill="#ffffff"/>
  <g stroke="#2e2e2e" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M145 120 H190
             c10 0 10 -35 20 -35 s10 70 20 70 s10 -70 20 -70 s10 70 20 70
             s10 -70 20 -70 s10 70 20 70 s10 -70 20 -70 s10 35 20 35 H405"/>
    <path d="M495 120 H540
             c10 0 10 -35 20 -35 s10 70 20 70 s10 -70 20 -70 s10 70 20 70
             s10 -70 20 -70 s10 70 20 70 s10 -70 20 -70 s10 35 20 35 H755"/>
  </g>
  <g fill="#8e6f3e" stroke="#2e2e2e" stroke-width="3">
    <circle cx="120" cy="120" r="24"/>
    <circle cx="450" cy="120" r="30"/>
    <circle cx="780" cy="120" r="24"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#2e2e2e" text-anchor="middle">
    <text x="120" y="62" font-size="30" font-style="italic">m</text>
    <text x="450" y="56" font-size="30" font-style="italic">M</text>
    <text x="780" y="62" font-size="30" font-style="italic">m</text>
    <text x="275" y="60" font-size="28" font-style="italic">k</text>
    <text x="625" y="60" font-size="28" font-style="italic">k</text>
  </g>
  <g stroke="#4f6d7a" stroke-width="4" marker-end="url(#arrow)">
    <path d="M75 195 H165"/>
    <path d="M405 195 H495"/>
    <path d="M735 195 H825"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#2e2e2e" text-anchor="middle" font-size="28" font-style="italic">
    <text x="120" y="235">x</text>
    <text x="450" y="235">y</text>
    <text x="780" y="235">z</text>
  </g>
</svg>
