<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">Addition compared with multiplication in the complex plane</title>
  <desc id="desc">The left panel shows complex addition by a vector parallelogram. The right panel shows an input at phase theta and its product at phase theta plus phi, so multiplication scales the vector and adds phi to its phase.</desc>
  <defs>
    <marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8e6f3e"/></marker>
    <marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4f6d7a"/></marker>
    <marker id="a-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/></marker>
    <style>.title{font:600 20px Arial,sans-serif;fill:#222}.label{font:16px Arial,sans-serif;fill:#222}.small{font:14px Arial,sans-serif;fill:#555}.axis{stroke:#333;stroke-width:1.4}.guide{stroke:#858585;stroke-width:1.4;stroke-dasharray:6 6}</style>
  </defs>
  <rect width="960" height="450" fill="white"/>
  <line x1="480" y1="45" x2="480" y2="390" stroke="#dedede" stroke-width="2"/>
  <text x="240" y="32" text-anchor="middle" class="title">Addition: combine displacements</text>
  <line x1="55" y1="330" x2="435" y2="330" class="axis"/><line x1="105" y1="390" x2="105" y2="75" class="axis"/>
  <line x1="105" y1="330" x2="275" y2="245" stroke="#4f6d7a" stroke-width="4" marker-end="url(#a-blue)"/>
  <line x1="105" y1="330" x2="180" y2="175" stroke="#666" stroke-width="4" marker-end="url(#a-gray)"/>
  <line x1="275" y1="245" x2="350" y2="90" class="guide"/><line x1="180" y1="175" x2="350" y2="90" class="guide"/>
  <line x1="105" y1="330" x2="350" y2="90" stroke="#8e6f3e" stroke-width="5" marker-end="url(#a-gold)"/>
  <text x="204" y="273" class="label" fill="#4f6d7a">z₁</text><text x="125" y="238" class="label">z₂</text><text x="310" y="134" class="label" fill="#8e6f3e">z₁ + z₂</text>
  <text x="240" y="420" text-anchor="middle" class="small">Cartesian components add independently</text>

  <text x="720" y="32" text-anchor="middle" class="title">Multiplication: scale and rotate</text>
  <line x1="520" y1="330" x2="920" y2="330" class="axis"/><line x1="585" y1="395" x2="585" y2="75" class="axis"/>
  <line x1="585" y1="330" x2="725" y2="260" stroke="#4f6d7a" stroke-width="4" marker-end="url(#a-blue)"/>
  <line x1="585" y1="330" x2="850" y2="105" stroke="#8e6f3e" stroke-width="5" marker-end="url(#a-gold)"/>
  <path d="M675 330 A90 90 0 0 0 665.5 289.8" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <path d="M687.9 278.6 A115 115 0 0 0 672.7 255.6" fill="none" stroke="#8e6f3e" stroke-width="3"/>
  <text x="670" y="310" class="label">θ</text><text x="690" y="258" class="label">φ</text>
  <text x="745" y="190" class="small">output phase θ + φ</text>
  <text x="711" y="250" class="label" fill="#4f6d7a">z</text><text x="830" y="95" class="label" fill="#8e6f3e">az</text>
  <text x="735" y="360" text-anchor="middle" class="small">a = ρR(φ): length ×ρ, phase +φ</text>
  <rect x="545" y="382" width="350" height="45" rx="8" fill="#f7f3ea" stroke="#cfb991"/>
  <text x="720" y="410" text-anchor="middle" class="label">R(θ₁)R(θ₂) = R(θ₁ + θ₂)</text>
</svg>
