<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Complex coordinates, polar form, and conjugation</title>
  <desc id="desc">The first panel decomposes a complex number into Cartesian and polar coordinates. The second reflects it across the real axis to form the complex conjugate.</desc>
  <defs>
    <marker id="gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8e6f3e"/></marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4f6d7a"/></marker>
    <style>.title{font:600 20px Arial,sans-serif;fill:#222}.label{font:16px Arial,sans-serif;fill:#222}.small{font:14px Arial,sans-serif;fill:#555}.axis{stroke:#333;stroke-width:1.4}.guide{stroke:#858585;stroke-width:1.4;stroke-dasharray:6 6}</style>
  </defs>
  <rect width="960" height="430" fill="white"/>
  <line x1="480" y1="45" x2="480" y2="392" stroke="#dedede" stroke-width="2"/>
  <text x="240" y="32" text-anchor="middle" class="title">One number, two coordinate systems</text>
  <line x1="65" y1="290" x2="425" y2="290" class="axis"/>
  <line x1="125" y1="390" x2="125" y2="70" class="axis"/>
  <text x="398" y="315" class="small">Re z</text><text x="78" y="82" class="small">Im z</text>
  <line x1="125" y1="290" x2="340" y2="130" stroke="#8e6f3e" stroke-width="5" marker-end="url(#gold-arrow)"/>
  <line x1="340" y1="130" x2="340" y2="290" class="guide"/><line x1="125" y1="130" x2="340" y2="130" class="guide"/>
  <path d="M183 290 A58 58 0 0 0 172 256" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <text x="184" y="258" class="label">θ</text><text x="222" y="194" class="label" fill="#8e6f3e">r = |z|</text>
  <text x="228" y="316" class="label">x</text><text x="350" y="216" class="label">y</text><text x="347" y="121" class="label">z = x + iy</text>
  <text x="240" y="415" text-anchor="middle" class="small">x = r cos θ,  y = r sin θ</text>

  <text x="720" y="32" text-anchor="middle" class="title">Conjugation reverses the phase</text>
  <line x1="525" y1="230" x2="915" y2="230" class="axis"/>
  <line x1="610" y1="392" x2="610" y2="70" class="axis"/>
  <text x="884" y="254" class="small">Re z</text><text x="562" y="82" class="small">Im z</text>
  <line x1="610" y1="230" x2="830" y2="120" stroke="#8e6f3e" stroke-width="5" marker-end="url(#gold-arrow)"/>
  <line x1="610" y1="230" x2="830" y2="340" stroke="#4f6d7a" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <line x1="830" y1="120" x2="830" y2="340" class="guide"/>
  <path d="M665 230 A55 55 0 0 0 659 205" fill="none" stroke="#8e6f3e" stroke-width="3"/>
  <path d="M665 230 A55 55 0 0 1 659 255" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <text x="666" y="204" class="label">θ</text><text x="665" y="275" class="label">−θ</text>
  <text x="839" y="116" class="label">z</text><text x="839" y="356" class="label">z* = x − iy</text>
  <text x="720" y="415" text-anchor="middle" class="small">|z*| = |z| and zz* = |z|²</text>
</svg>
