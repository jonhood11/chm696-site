<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">A rotating phase arrow and its cosine projection</title>
  <desc id="desc">The left panel shows a phase arrow at theta equals pi over three on a circle labeled at one, i, minus one, and minus i. Its horizontal projection is one half. The right panel marks the same phase and value on a cosine wave.</desc>
  <defs>
    <marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8e6f3e"/>
    </marker>
    <style>
      .title{font:600 20px Arial,sans-serif;fill:#222}.label{font:16px Arial,sans-serif;fill:#222}.small{font:14px Arial,sans-serif;fill:#555}.axis{stroke:#333;stroke-width:1.5}.guide{stroke:#858585;stroke-width:1.4;stroke-dasharray:6 6}.gold{stroke:#8e6f3e;fill:none}.blue{stroke:#4f6d7a;fill:none}
    </style>
  </defs>
  <rect width="960" height="420" fill="white"/>
  <line x1="480" y1="45" x2="480" y2="375" stroke="#dedede" stroke-width="2"/>

  <text x="240" y="34" text-anchor="middle" class="title">Phase as a rotating arrow</text>
  <line x1="72" y1="225" x2="408" y2="225" class="axis"/>
  <line x1="240" y1="57" x2="240" y2="393" class="axis"/>
  <circle cx="240" cy="225" r="112" fill="none" stroke="#9a9a9a" stroke-width="2"/>
  <text x="364" y="217" class="label">1</text>
  <text x="249" y="101" class="label">i</text>
  <text x="99" y="217" class="label">−1</text>
  <text x="249" y="361" class="label">−i</text>
  <path d="M240 225 L296 128" class="gold" stroke-width="5" marker-end="url(#arrow-gold)"/>
  <path d="M278 225 A38 38 0 0 0 259 192.1" class="blue" stroke-width="3"/>
  <text x="270" y="196" class="label" fill="#4f6d7a">θ = π/3</text>
  <line x1="296" y1="128" x2="296" y2="225" class="guide"/>
  <circle cx="296" cy="225" r="5" fill="#4f6d7a"/>
  <text x="261" y="250" class="small">projection = cos θ = 1/2</text>
  <text x="240" y="407" text-anchor="middle" class="small">one full turn advances the phase by 2π</text>

  <text x="720" y="34" text-anchor="middle" class="title">The projection is a cosine wave</text>
  <line x1="535" y1="225" x2="922" y2="225" class="axis"/>
  <line x1="550" y1="80" x2="550" y2="365" class="axis"/>
  <text x="918" y="246" text-anchor="end" class="label">phase</text>
  <text x="516" y="92" class="label">E/E₀</text>
  <path d="M550.0,115.0 L561.2,117.1 L572.5,123.4 L583.8,133.5 L595.0,147.2 L606.2,163.9 L617.5,182.9 L628.8,203.5 L640.0,225.0 L651.2,246.5 L662.5,267.1 L673.8,286.1 L685.0,302.8 L696.2,316.5 L707.5,326.6 L718.8,332.9 L730.0,335.0 L741.2,332.9 L752.5,326.6 L763.8,316.5 L775.0,302.8 L786.2,286.1 L797.5,267.1 L808.8,246.5 L820.0,225.0 L831.2,203.5 L842.5,182.9 L853.8,163.9 L865.0,147.2 L876.2,133.5 L887.5,123.4 L898.8,117.1 L910.0,115.0" class="gold" stroke-width="4"/>
  <line x1="610" y1="170" x2="610" y2="225" class="guide"/>
  <circle cx="610" cy="170" r="7" fill="#8e6f3e"/>
  <text x="618" y="160" class="label">θ = π/3, cos θ = 1/2</text>
  <text x="550" y="386" text-anchor="middle" class="small">0</text>
  <text x="640" y="386" text-anchor="middle" class="small">π/2</text>
  <text x="730" y="386" text-anchor="middle" class="small">π</text>
  <text x="820" y="386" text-anchor="middle" class="small">3π/2</text>
  <text x="910" y="386" text-anchor="middle" class="small">2π</text>
</svg>
