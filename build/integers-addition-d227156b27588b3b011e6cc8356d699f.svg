<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img"><title>Integers under addition: compose and undo</title><desc>Number lines show 0 plus 3 minus 2 equals 1, and 0 plus 3 minus 3 equals 0. All intermediate and final points are integers; zero is the identity and minus n is the inverse of n.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#2468a0"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#bb571d"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#939ea8"/></marker></defs><rect width="1000" height="440" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#242c36;font-size:18px}.title{font-size:22px;font-weight:bold}.small{font-size:16px;fill:#53616e}.formula{font-size:21px}</style><text x="25" y="32" class="title" text-anchor="start">Compose additions: 3 + (−2) = 1</text><line x1="90" y1="150" x2="920" y2="150" stroke="#aab4bd" stroke-width="1.5"/><line x1="140" y1="144" x2="140" y2="156" stroke="#7f8b96"/><text x="140" y="178" class="" text-anchor="middle">-4</text><line x1="220" y1="144" x2="220" y2="156" stroke="#7f8b96"/><text x="220" y="178" class="" text-anchor="middle">-3</text><line x1="300" y1="144" x2="300" y2="156" stroke="#7f8b96"/><text x="300" y="178" class="" text-anchor="middle">-2</text><line x1="380" y1="144" x2="380" y2="156" stroke="#7f8b96"/><text x="380" y="178" class="" text-anchor="middle">-1</text><line x1="460" y1="144" x2="460" y2="156" stroke="#7f8b96"/><text x="460" y="178" class="" text-anchor="middle">0</text><line x1="540" y1="144" x2="540" y2="156" stroke="#7f8b96"/><text x="540" y="178" class="" text-anchor="middle">1</text><line x1="620" y1="144" x2="620" y2="156" stroke="#7f8b96"/><text x="620" y="178" class="" text-anchor="middle">2</text><line x1="700" y1="144" x2="700" y2="156" stroke="#7f8b96"/><text x="700" y="178" class="" text-anchor="middle">3</text><line x1="780" y1="144" x2="780" y2="156" stroke="#7f8b96"/><text x="780" y="178" class="" text-anchor="middle">4</text><line x1="860" y1="144" x2="860" y2="156" stroke="#7f8b96"/><text x="860" y="178" class="" text-anchor="middle">5</text><path d="M 460 150 Q 580 20 700 150" fill="none" stroke="#2468a0" stroke-width="3" marker-end="url(#blue)"/><text x="580" y="73" class="" text-anchor="middle">+3</text><path d="M 700 150 Q 620 92 540 150" fill="none" stroke="#bb571d" stroke-width="3" marker-end="url(#orange)"/><text x="620" y="109" class="" text-anchor="middle">−2</text><text x="25" y="235" class="title" text-anchor="start">Undo an addition: 3 + (−3) = 0</text><line x1="90" y1="330" x2="920" y2="330" stroke="#aab4bd" stroke-width="1.5"/><line x1="140" y1="324" x2="140" y2="336" stroke="#7f8b96"/><text x="140" y="358" class="" text-anchor="middle">-4</text><line x1="220" y1="324" x2="220" y2="336" stroke="#7f8b96"/><text x="220" y="358" class="" text-anchor="middle">-3</text><line x1="300" y1="324" x2="300" y2="336" stroke="#7f8b96"/><text x="300" y="358" class="" text-anchor="middle">-2</text><line x1="380" y1="324" x2="380" y2="336" stroke="#7f8b96"/><text x="380" y="358" class="" text-anchor="middle">-1</text><line x1="460" y1="324" x2="460" y2="336" stroke="#7f8b96"/><text x="460" y="358" class="" text-anchor="middle">0</text><line x1="540" y1="324" x2="540" y2="336" stroke="#7f8b96"/><text x="540" y="358" class="" text-anchor="middle">1</text><line x1="620" y1="324" x2="620" y2="336" stroke="#7f8b96"/><text x="620" y="358" class="" text-anchor="middle">2</text><line x1="700" y1="324" x2="700" y2="336" stroke="#7f8b96"/><text x="700" y="358" class="" text-anchor="middle">3</text><line x1="780" y1="324" x2="780" y2="336" stroke="#7f8b96"/><text x="780" y="358" class="" text-anchor="middle">4</text><line x1="860" y1="324" x2="860" y2="336" stroke="#7f8b96"/><text x="860" y="358" class="" text-anchor="middle">5</text><path d="M 460 330 Q 580 220 700 330" fill="none" stroke="#2468a0" stroke-width="3" marker-end="url(#blue)"/><text x="580" y="263" class="" text-anchor="middle">+3</text><path d="M 700 330 Q 580 400 460 330" fill="none" stroke="#bb571d" stroke-width="3" marker-end="url(#orange)"/><text x="580" y="388" class="" text-anchor="middle">−3</text><text x="25" y="425" class="small" text-anchor="start">Identity: adding 0 changes nothing.     Inverse: adding −n undoes adding n.</text></svg>
