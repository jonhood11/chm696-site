<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img"><title>Permutations: the order of swaps matters</title><desc>Two mapping diagrams track labels 1, 2, 3. For ab, apply b=(23) first, then a=(12); label 1 ends at 2. For ba, apply a first, then b; label 1 ends at 3. Blue highlights the path from label 1.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#2468a0"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#bb571d"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#939ea8"/></marker></defs><rect width="1000" height="395" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#242c36;font-size:18px}.title{font-size:22px;font-weight:bold}.small{font-size:16px;fill:#53616e}.formula{font-size:21px}</style><text x="25" y="33" class="title" text-anchor="start">ab: apply b, then a</text><text x="145" y="84" class="" text-anchor="middle">b = (23)</text><text x="325" y="84" class="" text-anchor="middle">a = (12)</text><line x1="74" y1="215" x2="213" y2="295" stroke="#adb6be" stroke-width="1.6" marker-end="url(#gray)"/><line x1="254" y1="295" x2="393" y2="295" stroke="#adb6be" stroke-width="1.6" marker-end="url(#gray)"/><line x1="74" y1="295" x2="213" y2="215" stroke="#adb6be" stroke-width="1.6" marker-end="url(#gray)"/><line x1="254" y1="215" x2="393" y2="135" stroke="#adb6be" stroke-width="1.6" marker-end="url(#gray)"/><line x1="74" y1="135" x2="213" y2="135" stroke="#2468a0" stroke-width="3.5" marker-end="url(#blue)"/><line x1="254" y1="135" x2="393" y2="215" stroke="#2468a0" stroke-width="3.5" marker-end="url(#blue)"/><circle cx="55" cy="135" r="18" fill="#eaf3fb" stroke="#2468a0" stroke-width="1.5"/><text x="55" y="141" class="" text-anchor="middle">1</text><circle cx="55" cy="215" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="55" y="221" class="" text-anchor="middle">2</text><circle cx="55" cy="295" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="55" y="301" class="" text-anchor="middle">3</text><circle cx="235" cy="135" r="18" fill="#eaf3fb" stroke="#2468a0" stroke-width="1.5"/><text x="235" y="141" class="" text-anchor="middle">1</text><circle cx="235" cy="215" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="235" y="221" class="" text-anchor="middle">2</text><circle cx="235" cy="295" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="235" y="301" class="" text-anchor="middle">3</text><circle cx="415" cy="135" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="415" y="141" class="" text-anchor="middle">1</text><circle cx="415" cy="215" r="18" fill="#eaf3fb" stroke="#2468a0" stroke-width="1.5"/><text x="415" y="221" class="" text-anchor="middle">2</text><circle cx="415" cy="295" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="415" y="301" class="" text-anchor="middle">3</text><text x="25" y="351" class="formula" text-anchor="start">1 → 1 → 2, so ab(1) = 2</text><text x="525" y="33" class="title" text-anchor="start">ba: apply a, then b</text><text x="645" y="84" class="" text-anchor="middle">a = (12)</text><text x="825" y="84" class="" text-anchor="middle">b = (23)</text><line x1="574" y1="215" x2="713" y2="135" stroke="#adb6be" stroke-width="1.6" marker-end="url(#gray)"/><line x1="754" y1="135" x2="893" y2="135" stroke="#adb6be" stroke-width="1.6" marker-end="url(#gray)"/><line x1="574" y1="295" x2="713" y2="295" stroke="#adb6be" stroke-width="1.6" marker-end="url(#gray)"/><line x1="754" y1="295" x2="893" y2="215" stroke="#adb6be" stroke-width="1.6" marker-end="url(#gray)"/><line x1="574" y1="135" x2="713" y2="215" stroke="#2468a0" stroke-width="3.5" marker-end="url(#blue)"/><line x1="754" y1="215" x2="893" y2="295" stroke="#2468a0" stroke-width="3.5" marker-end="url(#blue)"/><circle cx="555" cy="135" r="18" fill="#eaf3fb" stroke="#2468a0" stroke-width="1.5"/><text x="555" y="141" class="" text-anchor="middle">1</text><circle cx="555" cy="215" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="555" y="221" class="" text-anchor="middle">2</text><circle cx="555" cy="295" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="555" y="301" class="" text-anchor="middle">3</text><circle cx="735" cy="135" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="735" y="141" class="" text-anchor="middle">1</text><circle cx="735" cy="215" r="18" fill="#eaf3fb" stroke="#2468a0" stroke-width="1.5"/><text x="735" y="221" class="" text-anchor="middle">2</text><circle cx="735" cy="295" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="735" y="301" class="" text-anchor="middle">3</text><circle cx="915" cy="135" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="915" y="141" class="" text-anchor="middle">1</text><circle cx="915" cy="215" r="18" fill="white" stroke="#b8c1c9" stroke-width="1.5"/><text x="915" y="221" class="" text-anchor="middle">2</text><circle cx="915" cy="295" r="18" fill="#eaf3fb" stroke="#2468a0" stroke-width="1.5"/><text x="915" y="301" class="" text-anchor="middle">3</text><text x="525" y="351" class="formula" text-anchor="start">1 → 2 → 3, so ba(1) = 3</text><text x="25" y="384" class="small" text-anchor="start">Each column lists the labels. Lines show where each label maps; blue tracks the starting label 1.</text></svg>
